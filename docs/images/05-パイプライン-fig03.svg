<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="780" height="232" role="img" aria-label="Where-Object・ForEach-Object・Select-Object の役割分担">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(255,78%,25%)"/>
			<stop offset="1" stop-color="hsl(255,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(180,78%,25%)"/>
			<stop offset="1" stop-color="hsl(180,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="14" y="20" width="244" height="94" rx="10" fill="url(#i1)"/>
	<text x="136" y="48" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Where-Object</text>
	<text x="136" y="70" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">絞る</text>
	<text x="136" y="94" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">件数が減る。中身は変わらない</text>

	<rect x="268" y="20" width="244" height="94" rx="10" fill="url(#i2)"/>
	<text x="390" y="48" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">ForEach-Object</text>
	<text x="390" y="70" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">変える</text>
	<text x="390" y="94" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">1件ずつ処理する。何を返すかは自由</text>

	<rect x="522" y="20" width="244" height="94" rx="10" fill="url(#i3)"/>
	<text x="644" y="48" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Select-Object</text>
	<text x="644" y="70" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">選ぶ</text>
	<text x="644" y="94" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">必要なプロパティだけ残す</text>

	<rect x="14" y="130" width="752" height="88" rx="10" fill="#fff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="390" y="152" fill="#1c2330" font-size="13.5" font-weight="700" text-anchor="middle">JavaScript の配列メソッドとの対応</text>
	<text x="136" y="178" fill="hsl(255,78%,32%)" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">.filter()</text>
	<text x="390" y="178" fill="hsl(180,78%,25%)" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">.map()</text>
	<text x="644" y="178" fill="hsl(35,78%,30%)" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">分割代入に近い</text>
	<text x="390" y="204" fill="#4a5568" font-size="12" text-anchor="middle">ForEach-Object と Select-Object は役割が重なる。プロパティを選ぶだけなら Select-Object が読みやすい</text>
</svg>
