<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="スコープの読み取りと書き込みの非対称">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(255,78%,25%)"/>
			<stop offset="1" stop-color="hsl(255,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="60" y="24" width="660" height="88" rx="10" fill="url(#i1)"/>
	<text x="390" y="50" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">スクリプトのスコープ</text>
	<text x="390" y="74" fill="#fff" font-size="13" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$outer = 'もとの値'</text>

	<rect x="180" y="120" width="420" height="76" rx="9" fill="url(#i2)"/>
	<text x="390" y="144" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">関数のスコープ</text>
	<text x="390" y="166" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">$outer を読む → 'もとの値' が見える ✓</text>
	<text x="390" y="186" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">$outer = '変更' → 関数内に新しい変数ができるだけ</text>

	<line x1="390" y1="112" x2="390" y2="118" stroke="#4a5568" stroke-width="2"/>

	<rect x="60" y="208" width="660" height="34" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="230" fill="#a51f22" font-size="13" font-weight="700" text-anchor="middle">関数を抜けると変更は消える。外の $outer は 'もとの値' のまま</text>
</svg>
