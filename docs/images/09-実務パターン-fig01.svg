<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 214" width="780" height="214" role="img" aria-label="ログ集計の処理の流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(255,78%,25%)"/>
			<stop offset="1" stop-color="hsl(255,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(200,78%,25%)"/>
			<stop offset="1" stop-color="hsl(200,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="10" y="26" width="172" height="76" rx="9" fill="url(#i1)"/>
	<text x="96" y="52" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">① 1行ずつ読む</text>
	<text x="96" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Get-Content</text>
	<text x="96" y="92" fill="#fff" font-size="11" text-anchor="middle" opacity="0.85">巨大でもメモリを使わない</text>

	<line x1="188" y1="64" x2="204" y2="64" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="204,57 220,64 204,71" fill="#4a5568"/>

	<rect x="226" y="26" width="172" height="76" rx="9" fill="url(#i2)"/>
	<text x="312" y="52" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">② 構造化する</text>
	<text x="312" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">-match ＋ $matches</text>
	<text x="312" y="92" fill="#fff" font-size="11" text-anchor="middle" opacity="0.85">文字列 → オブジェクト</text>

	<line x1="404" y1="64" x2="420" y2="64" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="420,57 436,64 420,71" fill="#4a5568"/>

	<rect x="442" y="26" width="172" height="76" rx="9" fill="url(#i3)"/>
	<text x="528" y="52" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">③ 絞る・集計</text>
	<text x="528" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Where / Group-Object</text>
	<text x="528" y="92" fill="#fff" font-size="11" text-anchor="middle" opacity="0.85">05 章のパイプライン</text>

	<line x1="620" y1="64" x2="636" y2="64" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="636,57 652,64 636,71" fill="#4a5568"/>

	<rect x="658" y="26" width="112" height="76" rx="9" fill="url(#i4)"/>
	<text x="714" y="52" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">④ 出す</text>
	<text x="714" y="74" fill="#fff" font-size="11" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Format-Table</text>
	<text x="714" y="92" fill="#fff" font-size="11" text-anchor="middle" opacity="0.85">最後に整形</text>

	<rect x="10" y="122" width="760" height="80" rx="9" fill="#fff" stroke="hsl(280,58%,65%)" stroke-width="2"/>
	<text x="390" y="146" fill="hsl(280,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">要は「テキストを早い段階でオブジェクトに変える」だけ</text>
	<text x="390" y="170" fill="#1c2330" font-size="12.5" text-anchor="middle">②でオブジェクトにしてしまえば、以降は 05 章で学んだ集計がそのまま使える</text>
	<text x="390" y="190" fill="#4a5568" font-size="12" text-anchor="middle">Bash なら awk / sort / uniq を駆使する部分が、Group-Object 1つで済む</text>
</svg>
