<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 244" width="780" height="244" role="img" aria-label="課題ごとに詰まりやすい箇所">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="90" y="20" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">課題</text>
	<text x="440" y="20" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">最も多い詰まり</text>

	<rect x="14" y="30" width="150" height="38" rx="7" fill="url(#i1)"/>
	<text x="89" y="54" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">1 文字化け</text>
	<rect x="176" y="30" width="590" height="38" rx="7" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="471" y="54" fill="#1c2330" font-size="12.5" text-anchor="middle">VS Code で保存し直したつもりが、エンコーディングが変わっていない</text>

	<rect x="14" y="76" width="150" height="38" rx="7" fill="url(#i1)"/>
	<text x="89" y="100" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">2 ランチャー</text>
	<rect x="176" y="76" width="590" height="38" rx="7" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="471" y="100" fill="#1c2330" font-size="12.5" text-anchor="middle">cmd を UTF-8 で保存してしまい、日本語のメッセージが化ける</text>

	<rect x="14" y="122" width="150" height="38" rx="7" fill="url(#i2)"/>
	<text x="89" y="146" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">3 プロセス</text>
	<rect x="176" y="122" width="590" height="38" rx="7" fill="#fff" stroke="hsl(35,58%,55%)" stroke-width="2"/>
	<text x="471" y="146" fill="#1c2330" font-size="12.5" text-anchor="middle">画面に出ている列名だけを探し、WorkingSet64 に辿り着けない</text>

	<rect x="14" y="168" width="150" height="38" rx="7" fill="url(#i2)"/>
	<text x="89" y="192" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">4 CSV</text>
	<rect x="176" y="168" width="590" height="38" rx="7" fill="#fff" stroke="hsl(35,58%,55%)" stroke-width="2"/>
	<text x="471" y="192" fill="#1c2330" font-size="12.5" text-anchor="middle">計算プロパティ @{N=...; E={...}} の書き方でつまずく</text>

	<rect x="14" y="214" width="150" height="26" rx="7" fill="url(#i1)"/>
	<text x="89" y="232" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">5 ログ集計</text>
	<rect x="176" y="214" width="590" height="26" rx="7" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="471" y="232" fill="#1c2330" font-size="12.5" text-anchor="middle">try/catch を書いたのに catch に入らない（-ErrorAction Stop の付け忘れ）</text>
</svg>
