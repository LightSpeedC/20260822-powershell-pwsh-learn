<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 254" width="780" height="254" role="img" aria-label="要素1個の配列が潰れる問題とその対策">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="390" y="20" fill="#1c2330" font-size="13.5" font-weight="700" text-anchor="middle">return $a — 要素数によって型が変わってしまう</text>

	<rect x="30" y="32" width="220" height="60" rx="8" fill="url(#i2)"/>
	<text x="140" y="56" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">要素 3 個</text>
	<text x="140" y="78" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">Object[] のまま</text>

	<rect x="280" y="32" width="220" height="60" rx="8" fill="url(#i1)"/>
	<text x="390" y="56" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">要素 1 個</text>
	<text x="390" y="78" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">String に潰れる</text>

	<rect x="530" y="32" width="220" height="60" rx="8" fill="url(#i1)"/>
	<text x="640" y="56" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">要素 0 個</text>
	<text x="640" y="78" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">$null になる</text>

	<rect x="30" y="106" width="720" height="44" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="126" fill="#a51f22" font-size="13" font-weight="700" text-anchor="middle">呼び出し側で $result.Count や foreach を書くと、件数によって動いたり壊れたりする</text>
	<text x="390" y="144" fill="#1c2330" font-size="12" text-anchor="middle">テストデータが2件以上だと気づけない。本番で1件になった日に初めて落ちる</text>

	<text x="390" y="180" fill="hsl(140,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">対策 — 先頭にカンマを付ける</text>

	<rect x="230" y="192" width="320" height="46" rx="8" fill="url(#i2)"/>
	<text x="390" y="221" fill="#fff" font-size="16" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">return ,$a</text>
</svg>
