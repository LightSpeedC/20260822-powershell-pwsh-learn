<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Add-Type と事前コンパイルの配布経路の違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/>
			<stop offset="1" stop-color="hsl(280,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(200,78%,25%)"/>
			<stop offset="1" stop-color="hsl(200,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="20" y="22" fill="#1c2330" font-size="13.5" font-weight="700">Add-Type（11.2〜11.6）</text>

	<rect x="20" y="34" width="170" height="54" rx="8" fill="url(#i1)"/>
	<text x="105" y="56" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">ps1 に C# を同梱</text>
	<text x="105" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">ソースを配る</text>

	<line x1="196" y1="61" x2="212" y2="61" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="212,54 228,61 212,68" fill="#4a5568"/>

	<rect x="234" y="34" width="200" height="54" rx="8" fill="url(#i2)"/>
	<text x="334" y="56" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">実行のたびにコンパイル</text>
	<text x="334" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">20〜180 ms／回</text>

	<line x1="440" y1="61" x2="456" y2="61" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="456,54 472,61 456,68" fill="#4a5568"/>

	<rect x="478" y="34" width="180" height="54" rx="8" fill="url(#i2)"/>
	<text x="568" y="56" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">メモリ上の型</text>
	<text x="568" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">プロセスが終われば消える</text>

	<rect x="672" y="34" width="108" height="54" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="726" y="56" fill="#a51f22" font-size="12" font-weight="700" text-anchor="middle">再定義は</text>
	<text x="726" y="74" fill="#a51f22" font-size="12" font-weight="700" text-anchor="middle">できない</text>

	<line x1="20" y1="106" x2="780" y2="106" stroke="#d9dfe8" stroke-width="2" stroke-dasharray="5 4"/>

	<text x="20" y="134" fill="#1c2330" font-size="13.5" font-weight="700">csc.exe で事前コンパイル（11.7）</text>

	<rect x="20" y="146" width="170" height="54" rx="8" fill="url(#i3)"/>
	<text x="105" y="168" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">.cs を書く</text>
	<text x="105" y="188" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">開発者の手元だけ</text>

	<line x1="196" y1="173" x2="212" y2="173" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="212,166 228,173 212,180" fill="#4a5568"/>

	<rect x="234" y="146" width="200" height="54" rx="8" fill="url(#i4)"/>
	<text x="334" y="168" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">csc.exe で1回ビルド</text>
	<text x="334" y="188" fill="#fff" font-size="11" text-anchor="middle" opacity="0.9" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">/target:exe ／ /target:library</text>

	<line x1="440" y1="173" x2="456" y2="173" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="456,166 472,173 456,180" fill="#4a5568"/>

	<rect x="478" y="146" width="180" height="54" rx="8" fill="url(#i3)"/>
	<text x="568" y="168" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Sum.exe / MyTools.dll</text>
	<text x="568" y="188" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">ファイルとして残る</text>

	<rect x="672" y="146" width="108" height="54" rx="8" fill="#fff" stroke="hsl(140,58%,55%)" stroke-width="2"/>
	<text x="726" y="168" fill="hsl(140,78%,25%)" font-size="12" font-weight="700" text-anchor="middle">何度読んでも</text>
	<text x="726" y="186" fill="hsl(140,78%,25%)" font-size="12" font-weight="700" text-anchor="middle">エラーなし</text>

	<rect x="20" y="216" width="760" height="72" rx="9" fill="#fff" stroke="hsl(0,58%,65%)" stroke-width="2"/>
	<text x="400" y="240" fill="hsl(0,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">配る先に要るもの</text>
	<text x="400" y="264" fill="#1c2330" font-size="12.5" text-anchor="middle">上：PowerShell と C# ソース（実行環境のコンパイラに依存する）</text>
	<text x="400" y="282" fill="#1c2330" font-size="12.5" text-anchor="middle">下：exe ひとつ。PowerShell すら要らない</text>
</svg>
