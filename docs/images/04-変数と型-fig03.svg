<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="比較演算子の大文字小文字の扱い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="196" y="20" fill="hsl(0,78%,30%)" font-size="14" font-weight="700" text-anchor="middle">既定 — 区別しない</text>
	<text x="584" y="20" fill="hsl(140,78%,25%)" font-size="14" font-weight="700" text-anchor="middle">c 付き — 区別する</text>

	<rect x="20" y="34" width="352" height="50" rx="8" fill="url(#i1)"/>
	<text x="196" y="65" fill="#fff" font-size="15" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">"abc" -eq "ABC" → True</text>

	<rect x="408" y="34" width="352" height="50" rx="8" fill="url(#i2)"/>
	<text x="584" y="65" fill="#fff" font-size="15" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">"abc" -ceq "ABC" → False</text>

	<rect x="20" y="96" width="352" height="50" rx="8" fill="url(#i1)"/>
	<text x="196" y="127" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">"aBc" -replace "b","X" → aXc</text>

	<rect x="408" y="96" width="352" height="50" rx="8" fill="url(#i2)"/>
	<text x="584" y="127" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">"aBc" -creplace "b","X" → aBc</text>

	<rect x="20" y="164" width="740" height="72" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="186" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">事故の例: readme.html を README.html にリネームする処理</text>
	<text x="390" y="207" fill="#1c2330" font-size="12.5" text-anchor="middle">$new = $name -replace 'readme','README' の結果を $old -ne $new で判定すると</text>
	<text x="390" y="226" fill="#1c2330" font-size="12.5" text-anchor="middle">大小文字しか違わないため「変更なし」と誤判定し、リネームがスキップされる</text>
</svg>
