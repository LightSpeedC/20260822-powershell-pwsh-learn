<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="780" height="232" role="img" aria-label="robocopy の終了コードの意味">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="100" y="20" fill="#1c2330" font-size="13" font-weight="700" text-anchor="middle">終了コード</text>
	<text x="440" y="20" fill="#1c2330" font-size="13" font-weight="700" text-anchor="middle">意味</text>

	<rect x="20" y="30" width="160" height="40" rx="7" fill="url(#i1)"/>
	<text x="100" y="55" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">0</text>
	<rect x="196" y="30" width="564" height="40" rx="7" fill="#fff" stroke="hsl(140,58%,55%)" stroke-width="2"/>
	<text x="478" y="55" fill="hsl(140,78%,25%)" font-size="13" font-weight="700" text-anchor="middle">成功 — 差分がなくコピー不要だった</text>

	<rect x="20" y="78" width="160" height="40" rx="7" fill="url(#i1)"/>
	<text x="100" y="103" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text>
	<rect x="196" y="78" width="564" height="40" rx="7" fill="#fff" stroke="hsl(140,58%,55%)" stroke-width="2"/>
	<text x="478" y="103" fill="hsl(140,78%,25%)" font-size="13" font-weight="700" text-anchor="middle">成功 — ファイルをコピーした</text>

	<rect x="20" y="126" width="160" height="40" rx="7" fill="url(#i2)"/>
	<text x="100" y="151" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2 〜 7</text>
	<rect x="196" y="126" width="564" height="40" rx="7" fill="#fff" stroke="hsl(35,58%,55%)" stroke-width="2"/>
	<text x="478" y="151" fill="hsl(35,78%,30%)" font-size="13" font-weight="700" text-anchor="middle">成功だが要確認 — 余分なファイルの検出・スキップなど</text>

	<rect x="20" y="174" width="160" height="40" rx="7" fill="url(#i3)"/>
	<text x="100" y="199" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">8 以上</text>
	<rect x="196" y="174" width="564" height="40" rx="7" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="478" y="199" fill="#a51f22" font-size="13" font-weight="700" text-anchor="middle">失敗 — コピーできなかったファイルがある（16 は致命的）</text>
</svg>
