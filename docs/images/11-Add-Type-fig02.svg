<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 286" width="800" height="286" role="img" aria-label="5.1 と 7 の Add-Type のコンパイル経路の違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/>
			<stop offset="1" stop-color="hsl(280,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(200,78%,25%)"/>
			<stop offset="1" stop-color="hsl(200,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="200" y="20" fill="#1c2330" font-size="13.5" font-weight="700" text-anchor="middle">Windows PowerShell 5.1</text>
	<text x="600" y="20" fill="#1c2330" font-size="13.5" font-weight="700" text-anchor="middle">PowerShell 7</text>
	<line x1="400" y1="6" x2="400" y2="232" stroke="#d9dfe8" stroke-width="2" stroke-dasharray="5 4"/>

	<rect x="26" y="34" width="348" height="52" rx="8" fill="url(#i1)"/>
	<text x="200" y="56" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Add-Type -TypeDefinition</text>
	<text x="200" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">ソース文字列を受け取る</text>

	<line x1="200" y1="90" x2="200" y2="104" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="193,104 200,120 207,104" fill="#4a5568"/>

	<rect x="26" y="124" width="348" height="52" rx="8" fill="url(#i2)"/>
	<text x="200" y="146" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">一時 .cs ファイルに書き出す</text>
	<text x="200" y="166" fill="#fff" font-size="11" text-anchor="middle" opacity="0.9" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">%TEMP%\xxxxxxxx.0.cs</text>

	<line x1="200" y1="180" x2="200" y2="194" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="193,194 200,210 207,194" fill="#4a5568"/>

	<rect x="26" y="214" width="348" height="60" rx="8" fill="url(#i3)"/>
	<text x="200" y="238" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">csc.exe を別プロセスで起動</text>
	<text x="200" y="258" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">.NET Framework 同梱 ／ C# 5 まで</text>

	<rect x="426" y="34" width="348" height="52" rx="8" fill="url(#i1)"/>
	<text x="600" y="56" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Add-Type -TypeDefinition</text>
	<text x="600" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">ソース文字列を受け取る</text>

	<line x1="600" y1="90" x2="600" y2="194" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="593,194 600,210 607,194" fill="#4a5568"/>
	<text x="600" y="150" fill="#4a5568" font-size="12" font-weight="700" text-anchor="middle">ファイルを経由しない</text>

	<rect x="426" y="214" width="348" height="60" rx="8" fill="url(#i4)"/>
	<text x="600" y="238" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Roslyn がプロセス内でコンパイル</text>
	<text x="600" y="258" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">最新の C# ／ 2回目以降は高速</text>
</svg>
