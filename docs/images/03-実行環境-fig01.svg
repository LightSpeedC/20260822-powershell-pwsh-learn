<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" role="img" aria-label="5.1 と 7 は別プログラムとして共存する">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(275,78%,25%)"/>
			<stop offset="1" stop-color="hsl(275,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(211,78%,25%)"/>
			<stop offset="1" stop-color="hsl(211,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="14" y="14" width="368" height="58" rx="9" fill="url(#i1)"/>
	<text x="198" y="40" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Windows PowerShell 5.1</text>
	<text x="198" y="60" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">Windows に最初から入っている</text>

	<rect x="398" y="14" width="368" height="58" rx="9" fill="url(#i2)"/>
	<text x="582" y="40" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">PowerShell 7</text>
	<text x="582" y="60" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">自分で入れる</text>

	<rect x="14" y="86" width="368" height="72" rx="8" fill="#fff" stroke="hsl(275,58%,60%)" stroke-width="2"/>
	<text x="198" y="108" fill="hsl(275,78%,30%)" font-size="12" font-weight="700" text-anchor="middle">実行ファイル</text>
	<text x="198" y="128" fill="#1c2330" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">C:\Windows\System32\</text>
	<text x="198" y="146" fill="#1c2330" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">WindowsPowerShell\v1.0\powershell.exe</text>

	<rect x="398" y="86" width="368" height="72" rx="8" fill="#fff" stroke="hsl(211,58%,60%)" stroke-width="2"/>
	<text x="582" y="108" fill="hsl(211,78%,30%)" font-size="12" font-weight="700" text-anchor="middle">実行ファイル</text>
	<text x="582" y="128" fill="#1c2330" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">C:\Program Files\PowerShell\7\</text>
	<text x="582" y="146" fill="#1c2330" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">pwsh.exe</text>

	<rect x="14" y="172" width="368" height="46" rx="8" fill="#fff" stroke="hsl(275,58%,60%)" stroke-width="2"/>
	<text x="198" y="190" fill="hsl(275,78%,30%)" font-size="12" font-weight="700" text-anchor="middle">プロファイル</text>
	<text x="198" y="209" fill="#1c2330" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Documents\WindowsPowerShell\</text>

	<rect x="398" y="172" width="368" height="46" rx="8" fill="#fff" stroke="hsl(211,58%,60%)" stroke-width="2"/>
	<text x="582" y="190" fill="hsl(211,78%,30%)" font-size="12" font-weight="700" text-anchor="middle">プロファイル</text>
	<text x="582" y="209" fill="#1c2330" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Documents\PowerShell\</text>

	<rect x="14" y="232" width="752" height="30" rx="8" fill="#fff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="390" y="252" fill="#1c2330" font-size="13" font-weight="700" text-anchor="middle">実行ファイルも設定も別々。片方を変えてももう片方には影響しない</text>
</svg>
