<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" width="780" height="262" role="img" aria-label="外部コマンドの失敗は例外にならない">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(211,78%,25%)"/>
			<stop offset="1" stop-color="hsl(211,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="230" y="18" width="320" height="44" rx="8" fill="url(#i1)"/>
	<text x="390" y="46" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">robocopy ... （失敗）</text>

	<line x1="390" y1="64" x2="390" y2="80" stroke="#4a5568" stroke-width="2"/>
	<polygon points="383,80 390,96 397,80" fill="#4a5568"/>

	<rect x="20" y="102" width="360" height="46" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="200" y="122" fill="#a51f22" font-size="13" font-weight="700" text-anchor="middle">try/catch では捕まらない</text>
	<text x="200" y="140" fill="#4a5568" font-size="11.5" text-anchor="middle">-ErrorAction Stop も効かない</text>

	<rect x="400" y="102" width="360" height="46" rx="8" fill="url(#i2)"/>
	<text x="580" y="122" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">$LASTEXITCODE で判定する</text>
	<text x="580" y="140" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">0 以外なら失敗（コマンドによる）</text>

	<rect x="20" y="164" width="740" height="42" rx="8" fill="url(#i3)"/>
	<text x="390" y="182" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">PowerShell 7 なら例外にもできる</text>
	<text x="390" y="199" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$PSNativeCommandUseErrorActionPreference = $true</text>

	<rect x="20" y="216" width="740" height="38" rx="8" fill="#fff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="390" y="240" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">既定は $false。5.1 には無いので、両対応なら $LASTEXITCODE で書く</text>
</svg>
