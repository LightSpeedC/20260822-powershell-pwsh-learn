<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-label="Word・Excel・PowerPoint の PDF 化方法の違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(240,78%,25%)"/>
			<stop offset="1" stop-color="hsl(240,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(20,78%,25%)"/>
			<stop offset="1" stop-color="hsl(20,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="12" y="24" width="244" height="150" rx="9" fill="url(#i1)"/>
	<text x="134" y="50" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Word</text>
	<text x="134" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$doc.ExportAsFixedFormat(</text>
	<text x="134" y="94" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">    $pdf, 17)</text>
	<text x="134" y="120" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.88">wdExportFormatPDF = 17</text>
	<text x="134" y="142" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.88">引数は （パス, 形式）</text>
	<text x="134" y="162" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.8">SaveAs2($pdf, 17) でも可</text>

	<rect x="268" y="24" width="244" height="150" rx="9" fill="url(#i2)"/>
	<text x="390" y="50" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Excel</text>
	<text x="390" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$book.ExportAsFixedFormat(</text>
	<text x="390" y="94" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">    0, $pdf)</text>
	<text x="390" y="120" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.88">xlTypePDF = 0</text>
	<text x="390" y="142" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.88">引数は （形式, パス）</text>
	<text x="390" y="162" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.8">Word と順番が逆</text>

	<rect x="524" y="24" width="244" height="150" rx="9" fill="url(#i3)"/>
	<text x="646" y="50" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">PowerPoint</text>
	<text x="646" y="76" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$pres.SaveAs($pdf, 32)</text>
	<text x="646" y="102" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.88">ppSaveAsPDF = 32</text>
	<text x="646" y="124" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.88">引数は （パス, 形式）</text>
	<text x="646" y="150" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">ExportAsFixedFormat は使えない</text>
	<text x="646" y="166" fill="#fff" font-size="11" text-anchor="middle" opacity="0.85">引数が解決できずエラーになる</text>

	<rect x="12" y="192" width="756" height="94" rx="9" fill="#fff" stroke="hsl(210,58%,65%)" stroke-width="2"/>
	<text x="390" y="216" fill="hsl(210,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">ExportAsFixedFormat で落ちたら SaveAs に形式番号を渡す</text>
	<text x="390" y="240" fill="#1c2330" font-size="12.5" text-anchor="middle">ExportAsFixedFormat は省略可能な引数が多く、PowerShell の遅延バインディングが解決に失敗しやすい</text>
	<text x="390" y="260" fill="#1c2330" font-size="12.5" text-anchor="middle">実測では Word と Excel は ExportAsFixedFormat / SaveAs のどちらでも PDF を作れた</text>
	<text x="390" y="278" fill="#4a5568" font-size="12" text-anchor="middle">PowerPoint だけは SaveAs(パス, 32) 一択</text>
</svg>
