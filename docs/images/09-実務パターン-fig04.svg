<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-label="タスクスケジューラから ps1 が実行されるまでの流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(255,78%,25%)"/>
			<stop offset="1" stop-color="hsl(255,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(211,78%,25%)"/>
			<stop offset="1" stop-color="hsl(211,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="14" y="24" width="176" height="62" rx="9" fill="url(#i1)"/>
	<text x="102" y="50" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">タスクスケジューラ</text>
	<text x="102" y="72" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">時刻・イベントで起動</text>

	<line x1="196" y1="55" x2="212" y2="55" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="212,48 228,55 212,62" fill="#4a5568"/>

	<rect x="234" y="24" width="176" height="62" rx="9" fill="url(#i2)"/>
	<text x="322" y="50" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">run.cmd</text>
	<text x="322" y="72" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">Shift-JIS / CRLF</text>

	<line x1="416" y1="55" x2="432" y2="55" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="432,48 448,55 432,62" fill="#4a5568"/>

	<rect x="454" y="24" width="176" height="62" rx="9" fill="url(#i3)"/>
	<text x="542" y="50" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">powershell.exe</text>
	<text x="542" y="72" fill="#fff" font-size="11" text-anchor="middle" opacity="0.9">-NoProfile -Bypass</text>

	<line x1="636" y1="55" x2="652" y2="55" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="652,48 668,55 652,62" fill="#4a5568"/>

	<rect x="674" y="24" width="92" height="62" rx="9" fill="url(#i3)"/>
	<text x="720" y="50" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">main.ps1</text>
	<text x="720" y="72" fill="#fff" font-size="11" text-anchor="middle" opacity="0.9">本体</text>

	<rect x="14" y="104" width="240" height="66" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="134" y="126" fill="#a51f22" font-size="12.5" font-weight="700" text-anchor="middle">① カレントが違う</text>
	<text x="134" y="146" fill="#1c2330" font-size="11.5" text-anchor="middle">C:\Windows\System32 など</text>
	<text x="134" y="163" fill="#4a5568" font-size="11" text-anchor="middle">→ $PSScriptRoot を使う</text>

	<rect x="270" y="104" width="240" height="66" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="126" fill="#a51f22" font-size="12.5" font-weight="700" text-anchor="middle">② 画面が無い</text>
	<text x="390" y="146" fill="#1c2330" font-size="11.5" text-anchor="middle">Write-Host は誰も見ない</text>
	<text x="390" y="163" fill="#4a5568" font-size="11" text-anchor="middle">→ ファイルにログを残す</text>

	<rect x="526" y="104" width="240" height="66" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="646" y="126" fill="#a51f22" font-size="12.5" font-weight="700" text-anchor="middle">③ 実行ユーザーが違う</text>
	<text x="646" y="146" fill="#1c2330" font-size="11.5" text-anchor="middle">ネットワークドライブが無い</text>
	<text x="646" y="163" fill="#4a5568" font-size="11" text-anchor="middle">→ UNC パスで書く</text>

	<rect x="14" y="186" width="752" height="52" rx="8" fill="#fff" stroke="hsl(70,58%,65%)" stroke-width="2"/>
	<text x="390" y="208" fill="hsl(70,78%,25%)" font-size="13" font-weight="700" text-anchor="middle">「手元では動くのにタスクからは動かない」の原因は、ほぼこの3つ</text>
	<text x="390" y="228" fill="#4a5568" font-size="12" text-anchor="middle">終了コードを返さないと、失敗しても成功扱いになる点も忘れずに</text>
</svg>
