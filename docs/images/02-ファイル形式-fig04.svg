<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" role="img" aria-label="改行コードの3種類">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/>
			<stop offset="1" stop-color="hsl(210,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(120,78%,25%)"/>
			<stop offset="1" stop-color="hsl(120,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(20,78%,25%)"/>
			<stop offset="1" stop-color="hsl(20,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="14" y="20" width="240" height="96" rx="9" fill="url(#i1)"/>
	<text x="134" y="46" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">CRLF</text>
	<text x="134" y="72" fill="#fff" font-size="17" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">0D 0A</text>
	<text x="134" y="94" fill="#fff" font-size="12" text-anchor="middle" opacity="0.9">Windows ／ bat ／ ps1</text>
	<text x="134" y="110" fill="#fff" font-size="11" text-anchor="middle" opacity="0.78">復帰＋改行の2バイト</text>

	<rect x="270" y="20" width="240" height="96" rx="9" fill="url(#i2)"/>
	<text x="390" y="46" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">LF</text>
	<text x="390" y="72" fill="#fff" font-size="17" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">0A</text>
	<text x="390" y="94" fill="#fff" font-size="12" text-anchor="middle" opacity="0.9">Unix ／ Linux ／ macOS</text>
	<text x="390" y="110" fill="#fff" font-size="11" text-anchor="middle" opacity="0.78">Node.js・Git の標準</text>

	<rect x="526" y="20" width="240" height="96" rx="9" fill="url(#i3)"/>
	<text x="646" y="46" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">CR</text>
	<text x="646" y="72" fill="#fff" font-size="17" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">0D</text>
	<text x="646" y="94" fill="#fff" font-size="12" text-anchor="middle" opacity="0.9">旧 Mac OS（〜9）</text>
	<text x="646" y="110" fill="#fff" font-size="11" text-anchor="middle" opacity="0.78">現在はほぼ使われない</text>

	<rect x="14" y="132" width="752" height="54" rx="9" fill="#fff" stroke="hsl(93.3,58%,65%)" stroke-width="2"/>
	<text x="390" y="154" fill="#1c2330" font-size="13" font-weight="700" text-anchor="middle">CR = Carriage Return（復帰・行頭に戻る）／ LF = Line Feed（改行・1行送る）</text>
	<text x="390" y="174" fill="#4a5568" font-size="12" text-anchor="middle">タイプライターの「用紙を戻す」「用紙を送る」という2つの動作がそのまま残ったもの</text>
</svg>
