<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 244" width="780" height="244" role="img" aria-label="配列の += は毎回新しい配列を作る">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="390" y="20" fill="#a51f22" font-size="14" font-weight="700" text-anchor="middle">$result += $item  — 1回ごとに配列を作り直す</text>

	<rect x="30" y="32" width="120" height="40" rx="7" fill="url(#i1)"/>
	<text x="90" y="57" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">[1]</text>
	<line x1="156" y1="52" x2="184" y2="52" stroke="#4a5568" stroke-width="2"/>
	<polygon points="184,45 200,52 184,59" fill="#4a5568"/>

	<rect x="206" y="32" width="150" height="40" rx="7" fill="url(#i1)"/>
	<text x="281" y="57" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">[1,2] ← 新規</text>
	<line x1="362" y1="52" x2="390" y2="52" stroke="#4a5568" stroke-width="2"/>
	<polygon points="390,45 406,52 390,59" fill="#4a5568"/>

	<rect x="412" y="32" width="170" height="40" rx="7" fill="url(#i1)"/>
	<text x="497" y="57" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">[1,2,3] ← 新規</text>
	<line x1="588" y1="52" x2="616" y2="52" stroke="#4a5568" stroke-width="2"/>
	<polygon points="616,45 632,52 616,59" fill="#4a5568"/>

	<rect x="638" y="32" width="112" height="40" rx="7" fill="url(#i1)"/>
	<text x="694" y="57" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">…</text>

	<text x="390" y="96" fill="#4a5568" font-size="12.5" text-anchor="middle">1万件なら1万回のコピー。要素数の2乗に比例して遅くなる</text>

	<text x="390" y="130" fill="hsl(140,78%,25%)" font-size="14" font-weight="700" text-anchor="middle">List を使えば追加するだけで済む</text>

	<rect x="150" y="144" width="480" height="46" rx="8" fill="url(#i2)"/>
	<text x="390" y="173" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$list.Add($item)</text>

	<rect x="30" y="204" width="720" height="32" rx="8" fill="#fff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="390" y="225" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">数十件なら += でも問題ない。数百件を超えるループでは List に切り替える</text>
</svg>
