<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 274" width="780" height="274" role="img" aria-label="PowerShell の switch は一致した分岐をすべて実行する">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(215,20%,35%)"/>
			<stop offset="1" stop-color="hsl(215,18%,62%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="390" y="20" fill="#1c2330" font-size="14" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">switch (5) { ... }</text>

	<rect x="60" y="34" width="480" height="38" rx="8" fill="url(#i1)"/>
	<text x="300" y="59" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">{$_ -gt 1}  { 'gt1' }</text>
	<text x="620" y="59" fill="hsl(140,78%,25%)" font-size="13" font-weight="700" text-anchor="middle">一致 → 実行</text>

	<rect x="60" y="80" width="480" height="38" rx="8" fill="url(#i1)"/>
	<text x="300" y="105" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">{$_ -gt 3}  { 'gt3' }</text>
	<text x="620" y="105" fill="hsl(140,78%,25%)" font-size="13" font-weight="700" text-anchor="middle">一致 → 実行</text>

	<rect x="60" y="126" width="480" height="38" rx="8" fill="url(#i3)"/>
	<text x="300" y="151" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">{$_ -gt 10} { 'gt10' }</text>
	<text x="620" y="151" fill="#4a5568" font-size="13" font-weight="700" text-anchor="middle">不一致 → 飛ばす</text>

	<rect x="60" y="178" width="660" height="36" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="202" fill="#a51f22" font-size="14" font-weight="700" text-anchor="middle">結果は gt1 と gt3 の2つ — 最初の1つで止まらない</text>

	<rect x="60" y="226" width="660" height="38" rx="8" fill="url(#i2)"/>
	<text x="390" y="250" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">1つだけ実行したいなら、各分岐の末尾に break を書く</text>
</svg>
