<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 214" width="780" height="214" role="img" aria-label="拡張子ごとに読むプログラムが異なる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/>
			<stop offset="1" stop-color="hsl(210,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="130" y="20" fill="#4a5568" font-size="12.5" font-weight="700" text-anchor="middle">ファイル</text>
	<text x="450" y="20" fill="#4a5568" font-size="12.5" font-weight="700" text-anchor="middle">読むプログラム</text>
	<text x="694" y="20" fill="#4a5568" font-size="12.5" font-weight="700" text-anchor="middle">期待する文字コード</text>

	<rect x="14" y="32" width="232" height="46" rx="8" fill="url(#i1)"/>
	<text x="130" y="61" fill="#fff" font-size="16" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">.ps1</text>
	<line x1="252" y1="55" x2="290" y2="55" stroke="hsl(210,58%,45%)" stroke-width="2.5"/>
	<polygon points="290,48 306,55 290,62" fill="hsl(210,58%,45%)"/>
	<rect x="314" y="32" width="272" height="46" rx="8" fill="#fff" stroke="hsl(210,58%,60%)" stroke-width="2"/>
	<text x="450" y="61" fill="hsl(210,78%,28%)" font-size="13.5" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">powershell.exe / pwsh.exe</text>
	<text x="694" y="60" fill="hsl(210,78%,28%)" font-size="12.5" font-weight="700" text-anchor="middle">BOM 付き UTF-8</text>

	<rect x="14" y="90" width="232" height="46" rx="8" fill="url(#i2)"/>
	<text x="130" y="119" fill="#fff" font-size="16" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">.bat / .cmd</text>
	<line x1="252" y1="113" x2="290" y2="113" stroke="hsl(35,58%,45%)" stroke-width="2.5"/>
	<polygon points="290,106 306,113 290,120" fill="hsl(35,58%,45%)"/>
	<rect x="314" y="90" width="272" height="46" rx="8" fill="#fff" stroke="hsl(35,58%,60%)" stroke-width="2"/>
	<text x="450" y="119" fill="hsl(35,78%,30%)" font-size="13.5" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">cmd.exe</text>
	<text x="694" y="118" fill="hsl(35,78%,30%)" font-size="12.5" font-weight="700" text-anchor="middle">Shift-JIS</text>

	<rect x="14" y="148" width="232" height="46" rx="8" fill="url(#i3)"/>
	<text x="130" y="177" fill="#fff" font-size="16" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">.js</text>
	<line x1="252" y1="171" x2="290" y2="171" stroke="hsl(140,58%,40%)" stroke-width="2.5"/>
	<polygon points="290,164 306,171 290,178" fill="hsl(140,58%,40%)"/>
	<rect x="314" y="148" width="272" height="46" rx="8" fill="#fff" stroke="hsl(140,58%,55%)" stroke-width="2"/>
	<text x="450" y="177" fill="hsl(140,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">node.exe</text>
	<text x="694" y="176" fill="hsl(140,78%,25%)" font-size="12.5" font-weight="700" text-anchor="middle">BOM なし UTF-8</text>
</svg>
