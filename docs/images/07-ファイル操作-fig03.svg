<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="780" height="232" role="img" aria-label="角括弧を含むファイル名はワイルドカードとして解釈される">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="390" y="20" fill="#1c2330" font-size="13.5" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">report[2026].txt が実在する状態で</text>

	<rect x="30" y="34" width="490" height="42" rx="8" fill="url(#i1)"/>
	<text x="275" y="60" fill="#fff" font-size="12.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Get-ChildItem -Path "report[2026].txt"</text>
	<text x="640" y="60" fill="#a51f22" font-size="15" font-weight="700" text-anchor="middle">0 件</text>

	<rect x="30" y="84" width="490" height="42" rx="8" fill="url(#i2)"/>
	<text x="275" y="110" fill="#fff" font-size="12.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Get-ChildItem -LiteralPath "report[2026].txt"</text>
	<text x="640" y="110" fill="hsl(140,78%,25%)" font-size="15" font-weight="700" text-anchor="middle">1 件</text>

	<rect x="30" y="140" width="720" height="82" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="162" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">[2026] は「2 か 0 か 6 のいずれか1文字」を意味する</text>
	<text x="390" y="184" fill="#1c2330" font-size="12.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">report2.txt / report0.txt / report6.txt</text>
	<text x="390" y="206" fill="#4a5568" font-size="12" text-anchor="middle">これらを探しに行くので 0 件になる。-Path では作成すらできない</text>
</svg>
