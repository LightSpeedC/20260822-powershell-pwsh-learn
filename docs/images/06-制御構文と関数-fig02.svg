<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" width="780" height="258" role="img" aria-label="関数呼び出しの正しい書き方と間違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="20" width="360" height="44" rx="8" fill="url(#i1)"/>
	<text x="200" y="48" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Show-Args 'x' 'y'</text>

	<rect x="400" y="20" width="360" height="44" rx="8" fill="url(#i2)"/>
	<text x="580" y="48" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Show-Args('x', 'y')</text>

	<text x="200" y="84" fill="hsl(140,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">✓ スペース区切り</text>
	<text x="580" y="84" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">✗ 他言語の書き方</text>

	<rect x="20" y="98" width="360" height="76" rx="8" fill="#fff" stroke="hsl(140,58%,60%)" stroke-width="2"/>
	<text x="200" y="122" fill="#1c2330" font-size="12.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$A = "x"  （String）</text>
	<text x="200" y="144" fill="#1c2330" font-size="12.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$B = "y"</text>
	<text x="200" y="166" fill="hsl(140,78%,25%)" font-size="12.5" font-weight="700" text-anchor="middle">意図どおり2つの引数になる</text>

	<rect x="400" y="98" width="360" height="76" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="580" y="122" fill="#1c2330" font-size="12.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$A = @("x","y")  （Object[]）</text>
	<text x="580" y="144" fill="#1c2330" font-size="12.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$B = 空</text>
	<text x="580" y="166" fill="#a51f22" font-size="12.5" font-weight="700" text-anchor="middle">配列1個が第1引数に入る</text>

	<rect x="20" y="190" width="740" height="56" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="212" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">エラーにならないので気づきにくい</text>
	<text x="390" y="233" fill="#1c2330" font-size="12.5" text-anchor="middle">第2引数が空のまま動き続け、後の処理で初めておかしくなる。名前付き（-Name 'x'）で呼べば防げる</text>
</svg>
