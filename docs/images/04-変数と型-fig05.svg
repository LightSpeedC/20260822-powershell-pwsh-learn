<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 302" width="780" height="302" role="img" aria-label="PowerShell の真偽変換の一覧">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="240" y="20" fill="hsl(0,78%,30%)" font-size="14" font-weight="700" text-anchor="middle">False になるもの</text>
	<text x="580" y="20" fill="hsl(140,78%,25%)" font-size="14" font-weight="700" text-anchor="middle">True になるもの</text>

	<rect x="70" y="32" width="340" height="34" rx="7" fill="url(#i2)"/>
	<text x="240" y="55" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">$null</text>
	<rect x="70" y="72" width="340" height="34" rx="7" fill="url(#i2)"/>
	<text x="240" y="95" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">0    ""（空文字列）</text>
	<rect x="70" y="112" width="340" height="34" rx="7" fill="url(#i2)"/>
	<text x="240" y="135" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">@()  @(0)</text>

	<rect x="410" y="32" width="340" height="34" rx="7" fill="url(#i1)"/>
	<text x="580" y="55" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">"0"    "false"</text>
	<rect x="410" y="72" width="340" height="34" rx="7" fill="url(#i1)"/>
	<text x="580" y="95" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">@(1,2)   0 以外の数値</text>
	<rect x="410" y="112" width="340" height="34" rx="7" fill="url(#i1)"/>
	<text x="580" y="135" fill="#fff" font-size="13.5" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">@{}（空のハッシュテーブル）</text>

	<rect x="30" y="164" width="720" height="60" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="186" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">空の配列 @() は False、空のハッシュテーブル @{} は True</text>
	<text x="390" y="208" fill="#1c2330" font-size="12.5" text-anchor="middle">同じ「空のコレクション」でも結果が逆になる。件数を見るなら .Count で判定する</text>

	<rect x="30" y="234" width="720" height="56" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="256" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">"false" も "0" も True になる</text>
	<text x="390" y="277" fill="#1c2330" font-size="12.5" text-anchor="middle">空でない文字列はすべて True。設定ファイルから読んだ "false" をそのまま判定に使わない</text>
</svg>
