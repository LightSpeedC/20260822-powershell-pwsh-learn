<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 244" width="780" height="244" role="img" aria-label="ConvertTo-Json の深さ制限でデータが失われる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="390" y="20" fill="#1c2330" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">@{ L1 = @{ L2 = @{ L3 = @{ L4 = 'ここまで届くか' } } } }</text>

	<rect x="20" y="34" width="740" height="62" rx="8" fill="url(#i1)"/>
	<text x="390" y="56" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ConvertTo-Json（既定 -Depth 2）</text>
	<text x="390" y="80" fill="#fff" font-size="12" text-anchor="middle" opacity="0.95" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">{"L1":{"L2":{"L3":"System.Collections.Hashtable"}}}</text>

	<rect x="20" y="106" width="740" height="62" rx="8" fill="url(#i2)"/>
	<text x="390" y="128" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ConvertTo-Json -Depth 10</text>
	<text x="390" y="152" fill="#fff" font-size="12" text-anchor="middle" opacity="0.95" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">{"L1":{"L2":{"L3":{"L4":"ここまで届くか"}}}}</text>

	<rect x="20" y="180" width="740" height="56" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="390" y="202" fill="#a51f22" font-size="13.5" font-weight="700" text-anchor="middle">深い部分が "System.Collections.Hashtable" という文字列に化ける</text>
	<text x="390" y="224" fill="#1c2330" font-size="12.5" text-anchor="middle">警告は出るが処理は続行される。書き出したファイルを開くまで気づかない</text>
</svg>
