<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 214" width="780" height="214" role="img" aria-label="デバッグの4つの手段">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(255,78%,25%)"/>
			<stop offset="1" stop-color="hsl(255,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(200,78%,25%)"/>
			<stop offset="1" stop-color="hsl(200,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="14" y="24" width="180" height="82" rx="9" fill="url(#i1)"/>
	<text x="104" y="50" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">F9 → F5</text>
	<text x="104" y="72" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">VS Code で</text>
	<text x="104" y="90" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">ブレークポイント</text>

	<rect x="206" y="24" width="180" height="82" rx="9" fill="url(#i2)"/>
	<text x="296" y="50" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Wait-Debugger</text>
	<text x="296" y="72" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">コードに書いて</text>
	<text x="296" y="90" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">その場で止める</text>

	<rect x="398" y="24" width="180" height="82" rx="9" fill="url(#i3)"/>
	<text x="488" y="50" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Set-PSBreakpoint</text>
	<text x="488" y="72" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">変数が変わった瞬間</text>
	<text x="488" y="90" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">に止められる</text>

	<rect x="590" y="24" width="176" height="82" rx="9" fill="url(#i4)"/>
	<text x="678" y="50" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Set-PSDebug</text>
	<text x="678" y="72" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">実行行を全部</text>
	<text x="678" y="90" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">表示する</text>

	<rect x="14" y="120" width="752" height="82" rx="9" fill="#fff" stroke="hsl(0,58%,65%)" stroke-width="2"/>
	<text x="390" y="144" fill="hsl(0,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">止めたあとは、その場のシェルにそのまま入れる</text>
	<text x="390" y="168" fill="#1c2330" font-size="12.5" text-anchor="middle">変数の中身を見るだけでなく、Get-Member でオブジェクトの構造を調べたり、</text>
	<text x="390" y="188" fill="#1c2330" font-size="12.5" text-anchor="middle">その場でコマンドを試したりできる — これが PowerShell のデバッグの強み</text>
</svg>
