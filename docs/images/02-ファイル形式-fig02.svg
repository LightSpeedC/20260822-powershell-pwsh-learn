<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" width="780" height="226" role="img" aria-label="同じ文字「あ」が文字コードによって異なるバイト列になる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(240,78%,25%)"/>
			<stop offset="1" stop-color="hsl(240,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/>
			<stop offset="1" stop-color="hsl(280,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="300" y="10" width="180" height="52" rx="9" fill="url(#i4)"/>
	<text x="390" y="45" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">「あ」</text>

	<path d="M340 64 V 84 H 130 V 104" fill="none" stroke="#4a5568" stroke-width="2"/>
	<polygon points="123,104 130,120 137,104" fill="#4a5568"/>
	<path d="M390 64 V 120" fill="none" stroke="#4a5568" stroke-width="2"/>
	<polygon points="383,104 390,120 397,104" fill="#4a5568"/>
	<path d="M440 64 V 84 H 650 V 104" fill="none" stroke="#4a5568" stroke-width="2"/>
	<polygon points="643,104 650,120 657,104" fill="#4a5568"/>

	<rect x="14" y="126" width="232" height="76" rx="9" fill="url(#i1)"/>
	<text x="130" y="150" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Shift-JIS (CP932)</text>
	<text x="130" y="176" fill="#fff" font-size="19" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">82 A0</text>
	<text x="130" y="194" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">2 バイト</text>

	<rect x="274" y="126" width="232" height="76" rx="9" fill="url(#i2)"/>
	<text x="390" y="150" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">UTF-8</text>
	<text x="390" y="176" fill="#fff" font-size="19" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">E3 81 82</text>
	<text x="390" y="194" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">3 バイト</text>

	<rect x="534" y="126" width="232" height="76" rx="9" fill="url(#i3)"/>
	<text x="650" y="150" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">UTF-16LE</text>
	<text x="650" y="176" fill="#fff" font-size="19" font-weight="700" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">42 30</text>
	<text x="650" y="194" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">2 バイト</text>
