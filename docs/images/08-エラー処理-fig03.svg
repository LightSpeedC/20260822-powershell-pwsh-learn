<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="780" height="232" role="img" aria-label="try catch finally の実行順">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(186.7,78%,25%)"/>
			<stop offset="1" stop-color="hsl(186.7,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="290" y="18" width="200" height="42" rx="8" fill="url(#i1)"/>
	<text x="390" y="45" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">try</text>

	<path d="M340 62 V 80 H 180 V 98" fill="none" stroke="#4a5568" stroke-width="2"/>
	<polygon points="173,98 180,114 187,98" fill="#4a5568"/>
	<path d="M440 62 V 80 H 600 V 98" fill="none" stroke="#4a5568" stroke-width="2"/>
	<polygon points="593,98 600,114 607,98" fill="#4a5568"/>

	<text x="250" y="78" fill="hsl(140,78%,25%)" font-size="12" font-weight="700" text-anchor="middle">成功</text>
	<text x="536" y="78" fill="#a51f22" font-size="12" font-weight="700" text-anchor="middle">終了エラー</text>

	<rect x="70" y="120" width="220" height="42" rx="8" fill="url(#i1)"/>
	<text x="180" y="147" fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle">そのまま次へ</text>

	<rect x="490" y="120" width="220" height="42" rx="8" fill="url(#i2)"/>
	<text x="600" y="147" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">catch</text>

	<path d="M180 164 V 178 H 340 V 190" fill="none" stroke="#4a5568" stroke-width="2"/>
	<path d="M600 164 V 178 H 440 V 190" fill="none" stroke="#4a5568" stroke-width="2"/>
	<polygon points="333,190 390,190 383,190" fill="none"/>

	<rect x="290" y="188" width="200" height="42" rx="8" fill="url(#i3)"/>
	<text x="390" y="215" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">finally — 必ず通る</text>
