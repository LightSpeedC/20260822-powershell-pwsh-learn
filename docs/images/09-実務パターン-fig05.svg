<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" width="780" height="226" role="img" aria-label="JSON を介した外部コマンドとのデータ受け渡し">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(211,78%,25%)"/>
			<stop offset="1" stop-color="hsl(211,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="26" width="200" height="62" rx="9" fill="url(#i1)"/>
	<text x="120" y="52" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">PowerShell</text>
	<text x="120" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">オブジェクト</text>

	<rect x="290" y="26" width="200" height="62" rx="9" fill="#fff" stroke="hsl(0,58%,65%)" stroke-width="2"/>
	<text x="390" y="52" fill="hsl(0,78%,25%)" font-size="14" font-weight="700" text-anchor="middle">JSON</text>
	<text x="390" y="74" fill="#4a5568" font-size="11.5" text-anchor="middle">標準出力を経由</text>

	<rect x="560" y="26" width="200" height="62" rx="9" fill="url(#i2)"/>
	<text x="660" y="52" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Node.js</text>
	<text x="660" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.9">JavaScript オブジェクト</text>

	<line x1="226" y1="48" x2="276" y2="48" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="276,41 292,48 276,55" fill="#4a5568"/>
	<text x="251" y="36" fill="#4a5568" font-size="10.5" font-weight="700" text-anchor="middle">ConvertTo-Json</text>

	<line x1="554" y1="68" x2="504" y2="68" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="504,61 488,68 504,75" fill="#4a5568"/>
	<text x="529" y="88" fill="#4a5568" font-size="10.5" font-weight="700" text-anchor="middle">ConvertFrom-Json</text>

	<rect x="20" y="108" width="740" height="100" rx="9" fill="#fff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="390" y="132" fill="#1c2330" font-size="13.5" font-weight="700" text-anchor="middle">なぜ JSON を挟むのか</text>
	<text x="390" y="156" fill="#1c2330" font-size="12.5" text-anchor="middle">外部コマンドの出力は必ず「ただの文字列」になる（01 章のテキストパイプと同じ状態）</text>
	<text x="390" y="176" fill="#1c2330" font-size="12.5" text-anchor="middle">列を数えて切り出すより、JSON にして ConvertFrom-Json するほうが確実で壊れにくい</text>
	<text x="390" y="196" fill="#4a5568" font-size="12" text-anchor="middle">相手のプログラムを自分で書けるなら、迷わず JSON を出力させる</text>
</svg>
