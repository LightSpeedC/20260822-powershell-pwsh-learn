<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" role="img" aria-label="5回の勉強会と課題・対応する章">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/>
			<stop offset="1" stop-color="hsl(280,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/>
			<stop offset="1" stop-color="hsl(210,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/>
			<stop offset="1" stop-color="hsl(70,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i5" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="70" y="20" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">回</text>
	<text x="230" y="20" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">課題</text>
	<text x="560" y="20" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">得られるもの</text>

	<rect x="14" y="30" width="112" height="40" rx="7" fill="url(#i1)"/>
	<text x="70" y="55" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">第1回 / 01・02</text>
	<rect x="136" y="30" width="256" height="40" rx="7" fill="#fff" stroke="hsl(280,58%,60%)" stroke-width="2"/>
	<text x="264" y="55" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">文字化けを再現して直す</text>
	<text x="560" y="55" fill="#4a5568" font-size="12" text-anchor="middle">BOM が何をしているかを体感する</text>

	<rect x="14" y="78" width="112" height="40" rx="7" fill="url(#i2)"/>
	<text x="70" y="103" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">第2回 / 03・04</text>
	<rect x="136" y="78" width="256" height="40" rx="7" fill="#fff" stroke="hsl(210,58%,60%)" stroke-width="2"/>
	<text x="264" y="103" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">ランチャー付き挨拶スクリプト</text>
	<text x="560" y="103" fill="#4a5568" font-size="12" text-anchor="middle">配布できる形を作れるようになる</text>

	<rect x="14" y="126" width="112" height="40" rx="7" fill="url(#i3)"/>
	<text x="70" y="151" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">第3回 / 05</text>
	<rect x="136" y="126" width="256" height="40" rx="7" fill="#fff" stroke="hsl(140,58%,55%)" stroke-width="2"/>
	<text x="264" y="151" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">プロセスをメモリ順に上位5件</text>
	<text x="560" y="151" fill="#4a5568" font-size="12" text-anchor="middle">Get-Member で自力で調べられる</text>

	<rect x="14" y="174" width="112" height="40" rx="7" fill="url(#i4)"/>
	<text x="70" y="199" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">第4回 / 06・07</text>
	<rect x="136" y="174" width="256" height="40" rx="7" fill="#fff" stroke="hsl(70,58%,50%)" stroke-width="2"/>
	<text x="264" y="199" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">ファイル一覧を CSV 出力</text>
	<text x="560" y="199" fill="#4a5568" font-size="12" text-anchor="middle">関数化と文字コード指定ができる</text>

	<rect x="14" y="222" width="112" height="40" rx="7" fill="url(#i5)"/>
	<text x="70" y="247" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">第5回 / 08・09</text>
	<rect x="136" y="222" width="256" height="40" rx="7" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="264" y="247" fill="#1c2330" font-size="12.5" font-weight="700" text-anchor="middle">ログ集計スクリプトを仕上げる</text>
	<text x="560" y="247" fill="#4a5568" font-size="12" text-anchor="middle">実務で使える1本が手元に残る</text>
</svg>
