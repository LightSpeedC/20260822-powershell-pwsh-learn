<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" role="img" aria-label="COM オブジェクトの解放とプロセス終了の関係">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/>
			<stop offset="1" stop-color="hsl(0,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="14" y="20" fill="#1c2330" font-size="13" font-weight="700">A. Quit() だけを呼んだ場合</text>

	<rect x="14" y="30" width="150" height="52" rx="8" fill="url(#i1)"/>
	<text x="89" y="52" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">$app.Quit()</text>
	<text x="89" y="70" fill="#fff" font-size="11" text-anchor="middle" opacity="0.88">終了を依頼する</text>

	<line x1="170" y1="56" x2="186" y2="56" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="186,49 202,56 186,63" fill="#4a5568"/>

	<rect x="208" y="30" width="252" height="52" rx="8" fill="#fff" stroke="hsl(0,58%,60%)" stroke-width="2"/>
	<text x="334" y="52" fill="#a51f22" font-size="12.5" font-weight="700" text-anchor="middle">PowerShell 側にまだ参照が残っている</text>
	<text x="334" y="70" fill="#1c2330" font-size="11.5" text-anchor="middle">$app / $book / $sheet …</text>

	<line x1="466" y1="56" x2="482" y2="56" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="482,49 498,56 482,63" fill="#4a5568"/>

	<rect x="504" y="30" width="262" height="52" rx="8" fill="url(#i1)"/>
	<text x="635" y="52" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">EXCEL.EXE が残ったまま</text>
	<text x="635" y="70" fill="#fff" font-size="11" text-anchor="middle" opacity="0.88">3 秒後に数えても 1 個</text>

	<text x="14" y="118" fill="#1c2330" font-size="13" font-weight="700">B. 参照を解放してから GC を回した場合</text>

	<rect x="14" y="128" width="150" height="52" rx="8" fill="url(#i2)"/>
	<text x="89" y="150" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">$app.Quit()</text>
	<text x="89" y="168" fill="#fff" font-size="11" text-anchor="middle" opacity="0.88">終了を依頼する</text>

	<line x1="170" y1="154" x2="186" y2="154" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="186,147 202,154 186,161" fill="#4a5568"/>

	<rect x="208" y="128" width="252" height="52" rx="8" fill="url(#i2)"/>
	<text x="334" y="150" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">ReleaseComObject を子から順に</text>
	<text x="334" y="168" fill="#fff" font-size="11" text-anchor="middle" opacity="0.88">[GC]::Collect() で取りこぼしも回収</text>

	<line x1="466" y1="154" x2="482" y2="154" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="482,147 498,154 482,161" fill="#4a5568"/>

	<rect x="504" y="128" width="262" height="52" rx="8" fill="url(#i2)"/>
	<text x="635" y="150" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">プロセスが消える</text>
	<text x="635" y="168" fill="#fff" font-size="11" text-anchor="middle" opacity="0.88">3 秒後に数えて 0 個</text>

	<rect x="14" y="198" width="752" height="58" rx="8" fill="#fff" stroke="hsl(140,58%,65%)" stroke-width="2"/>
	<text x="390" y="222" fill="hsl(140,78%,25%)" font-size="13" font-weight="700" text-anchor="middle">Office は「誰も見ていない」と分かって初めて終了する</text>
	<text x="390" y="244" fill="#1c2330" font-size="12.5" text-anchor="middle">Quit() は終了の依頼にすぎず、参照が 1 つでも残っていれば待ち続ける</text>
</svg>
