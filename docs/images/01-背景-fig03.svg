<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" role="img" aria-label="テキストパイプとオブジェクトパイプの違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(30,78%,25%)"/>
			<stop offset="1" stop-color="hsl(30,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(212,78%,25%)"/>
			<stop offset="1" stop-color="hsl(212,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="186" y="20" fill="hsl(30,78%,32%)" font-size="15" font-weight="700" text-anchor="middle">Bash — テキストパイプ</text>
	<text x="594" y="20" fill="hsl(212,78%,32%)" font-size="15" font-weight="700" text-anchor="middle">PowerShell — オブジェクトパイプ</text>

	<rect x="56" y="34" width="260" height="46" rx="8" fill="url(#i1)"/>
	<text x="186" y="63" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">ps aux</text>
	<line x1="186" y1="80" x2="186" y2="98" stroke="hsl(30,58%,45%)" stroke-width="2.5"/>
	<polygon points="179,98 186,114 193,98" fill="hsl(30,58%,45%)"/>

	<rect x="56" y="116" width="260" height="52" rx="8" fill="#fff" stroke="hsl(30,58%,65%)" stroke-width="2" stroke-dasharray="6 4"/>
	<text x="186" y="138" fill="#1c2330" font-size="11.5" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace" text-anchor="middle">root 1823 0.4 node server.js</text>
	<text x="186" y="158" fill="#a51f22" font-size="11.5" font-weight="700" text-anchor="middle">列を数えて awk で切り出す</text>
	<line x1="186" y1="168" x2="186" y2="186" stroke="hsl(30,58%,45%)" stroke-width="2.5"/>
	<polygon points="179,186 186,202 193,186" fill="hsl(30,58%,45%)"/>

	<rect x="56" y="204" width="260" height="46" rx="8" fill="url(#i1)"/>
	<text x="186" y="233" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">xargs kill</text>

	<rect x="464" y="34" width="260" height="46" rx="8" fill="url(#i2)"/>
	<text x="594" y="63" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Get-Process</text>
	<line x1="594" y1="80" x2="594" y2="98" stroke="hsl(212,58%,45%)" stroke-width="2.5"/>
	<polygon points="587,98 594,114 601,98" fill="hsl(212,58%,45%)"/>

	<rect x="464" y="116" width="260" height="52" rx="8" fill="#fff" stroke="hsl(212,58%,65%)" stroke-width="2"/>
	<text x="594" y="136" fill="hsl(212,78%,30%)" font-size="12" font-weight="700" text-anchor="middle">Process オブジェクト</text>
	<text x="594" y="156" fill="#4a5568" font-size="11.5" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">.Id  .Name  .Memory</text>
	<line x1="594" y1="168" x2="594" y2="186" stroke="hsl(212,58%,45%)" stroke-width="2.5"/>
	<polygon points="587,186 594,202 601,186" fill="hsl(212,58%,45%)"/>

	<rect x="464" y="204" width="260" height="46" rx="8" fill="url(#i2)"/>
	<text x="594" y="233" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="BIZ UDゴシック, ＭＳ ゴシック, Consolas, monospace">Stop-Process</text>

	<line x1="390" y1="30" x2="390" y2="254" stroke="#d9dfe8" stroke-width="2" stroke-dasharray="4 5"/>
</svg>
