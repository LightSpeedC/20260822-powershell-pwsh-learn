<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" role="img" aria-label="PowerShell・Bash・Node.js の守備範囲">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(212,78%,25%)"/>
			<stop offset="1" stop-color="hsl(212,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(30,78%,25%)"/>
			<stop offset="1" stop-color="hsl(30,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(128,78%,25%)"/>
			<stop offset="1" stop-color="hsl(128,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="14" y="14" width="240" height="126" rx="10" fill="url(#i1)"/>
	<text x="134" y="46" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">PowerShell</text>
	<text x="134" y="72" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">Windows システム管理</text>
	<text x="134" y="92" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">.NET 統合 ／ 自動化</text>
	<text x="134" y="112" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">オブジェクトパイプ</text>
	<text x="134" y="132" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.75">△ 非同期・Web は後発</text>

	<rect x="270" y="14" width="240" height="126" rx="10" fill="url(#i2)"/>
	<text x="390" y="46" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Bash</text>
	<text x="390" y="72" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">Unix/Linux の管理</text>
	<text x="390" y="92" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">テキスト処理 ／ 移植性</text>
	<text x="390" y="112" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">小ツールの組み合わせ</text>
	<text x="390" y="132" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.75">△ 大規模スクリプトは苦手</text>

	<rect x="526" y="14" width="240" height="126" rx="10" fill="url(#i3)"/>
	<text x="646" y="46" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Node.js</text>
	<text x="646" y="72" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">Web ／ API サーバー</text>
	<text x="646" y="92" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">非同期 ／ JSON 処理</text>
	<text x="646" y="112" fill="#fff" font-size="12.5" text-anchor="middle" opacity="0.92">大規模アプリ開発</text>
	<text x="646" y="132" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.75">△ OS 機能へは間接的</text>

	<rect x="14" y="160" width="752" height="56" rx="10" fill="#fff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="390" y="182" fill="#1c2330" font-size="13" font-weight="700" text-anchor="middle">流れるデータの型が、その言語の得意分野を決めている</text>
	<text x="134" y="204" fill="hsl(212,78%,32%)" font-size="12" font-weight="600" text-anchor="middle">オブジェクト</text>
	<text x="390" y="204" fill="hsl(30,78%,32%)" font-size="12" font-weight="600" text-anchor="middle">テキスト行</text>
	<text x="646" y="204" fill="hsl(128,78%,25%)" font-size="12" font-weight="600" text-anchor="middle">JSON / Promise</text>
</svg>
