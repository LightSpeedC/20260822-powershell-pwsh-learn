<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" width="780" height="226" role="img" aria-label="ドライランを挟んだ安全なリネームの流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(200,78%,25%)"/>
			<stop offset="1" stop-color="hsl(200,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(35,78%,25%)"/>
			<stop offset="1" stop-color="hsl(35,58%,65%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/>
			<stop offset="1" stop-color="hsl(140,58%,65%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="26" width="220" height="76" rx="9" fill="url(#i1)"/>
	<text x="130" y="52" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">① -WhatIf で実行</text>
	<text x="130" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">実際には変更されない</text>
	<text x="130" y="92" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.85">「何が起きるか」だけ出る</text>

	<line x1="246" y1="64" x2="262" y2="64" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="262,57 278,64 262,71" fill="#4a5568"/>

	<rect x="284" y="26" width="220" height="76" rx="9" fill="url(#i2)"/>
	<text x="394" y="52" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">② 目視で確認</text>
	<text x="394" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">正規表現が意図どおりか</text>
	<text x="394" y="92" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.85">重複した名前が出ないか</text>

	<line x1="510" y1="64" x2="526" y2="64" stroke="#4a5568" stroke-width="2.5"/>
	<polygon points="526,57 542,64 526,71" fill="#4a5568"/>

	<rect x="548" y="26" width="212" height="76" rx="9" fill="url(#i3)"/>
	<text x="654" y="52" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">③ 本実行</text>
	<text x="654" y="74" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.92">-WhatIf を外すだけ</text>
	<text x="654" y="92" fill="#fff" font-size="11.5" text-anchor="middle" opacity="0.85">コードは1文字も変えない</text>

	<rect x="20" y="122" width="740" height="90" rx="9" fill="#fff" stroke="hsl(210,58%,65%)" stroke-width="2"/>
	<text x="390" y="146" fill="hsl(210,78%,25%)" font-size="13.5" font-weight="700" text-anchor="middle">-WhatIf は PowerShell が用意している標準の仕組み</text>
	<text x="390" y="170" fill="#1c2330" font-size="12.5" text-anchor="middle">Remove-Item・Rename-Item・Move-Item など、変更を伴うコマンドの多くが対応している</text>
	<text x="390" y="192" fill="#4a5568" font-size="12" text-anchor="middle">自作関数でも [CmdletBinding(SupportsShouldProcess)] を書けば同じ仕組みが使える</text>
</svg>
